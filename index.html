<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GRBL CAM Pro Visualizer met False Color Heightmap">

  <!-- Titels voor tabblad en browser-meldingen -->
  <title>GRBL CAM Pro Visualizer v1.0.2</title>
  <meta property="og:title" content="GRBL CAM Pro Visualizer v1.0.2">
  <meta name="twitter:title" content="GRBL CAM Pro Visualizer v1.0.2">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #eceff1; color: #263238; max-width: 650px; margin: 0 auto; }
    .header-container { text-align: center; margin-bottom: 15px; }
    h1 { margin: 0 0 5px 0; color: #37474f; font-size: 24px; }
    .version-badge { display: inline-block; background: #00897b; color: white; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
    label { font-weight: bold; display: block; margin-top: 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #455a64; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #cfd8dc; border-radius: 6px; font-size: 14px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { background: #00897b; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 15px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    button:hover { background: #00695c; }
    button.btn-alt { background: #546e7a; }
    button.btn-alt:hover { background: #37474f; }
    canvas { max-width: 100%; border: 1px solid #b0bec5; border-radius: 6px; margin-top: 8px; background: #000; display: block; }
    textarea { width: 100%; height: 90px; font-family: monospace; font-size: 11px; margin-top: 10px; box-sizing: border-box; }
    .canvas-title { font-size: 12px; font-weight: bold; margin-top: 10px; color: #607d8b; }
    .modal { display: none; background: #fff; border: 2px solid #00897b; padding: 15px; border-radius: 10px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>⚙️ GRBL CAM Pro Visualizer</h1>
    <span class="version-badge" id="appVersion">v1.0.2</span>
  </div>

  <div class="card">
    <label>1. Afbeelding & Previews</label>
    <input type="file" id="imageInput" accept="image/*">

    <div class="canvas-title">1. Origineel + Contour Overlay (Rood = Freespad)</div>
    <canvas id="previewCanvas"></canvas>

    <div class="canvas-title">2. True Color Heightmap (Blauw = Diep, Groen/Geel/Rood = Ondiep)</div>
    <canvas id="heightmapCanvas"></canvas>
  </div>

  <div class="card">
    <label>2. Dynamic Freesbibliotheek</label>
    <label>Selecteer Frees:</label>
    <select id="bitSelect" onchange="loadSelectedBit()"></select>

    <button type="button" class="btn-alt" onclick="toggleAddBitModal()">➕ Nieuwe Frees Toevoegen</button>

    <div id="addBitModal" class="modal">
      <h3 style="margin-top:0;">Nieuwe Frees Aanmaken</h3>
      <label>Categorie:</label>
      <select id="newCategory">
        <option value="vlak">Vlakfrees (Flat Endmill)</option>
        <option value="bol">Bolfrees (Ballnose)</option>
        <option value="punt">Puntfrees / V-Bit</option>
      </select>
      <label>Naam / Omschrijving:</label>
      <input type="text" id="newName" placeholder="bijv. V-Bit 60 graden 6mm">
      <div class="row">
        <div>
          <label>Dia (mm):</label>
          <input type="number" id="newDia" value="3.175" step="0.1">
        </div>
        <div>
          <label>V-Hoek (°):</label>
          <input type="number" id="newAngle" value="60" placeholder="Alleen bij Punt">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Feed (mm/min):</label>
          <input type="number" id="newFeed" value="600">
        </div>
        <div>
          <label>Spindel (RPM):</label>
          <input type="number" id="newSpindle" value="12000">
        </div>
      </div>
      <label>Overlap (%):</label>
      <input type="number" id="newStepover" value="40">
      <button type="button" onclick="saveNewBit()">💾 Opslaan in Bibliotheek</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <div>
        <label>Aanvoersnelheid F (mm/min):</label>
        <input type="number" id="feedRate" value="600">
      </div>
      <div>
        <label>Spindel S (RPM):</label>
        <input type="number" id="spindleSpeed" value="12000">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Overlap / Stepover (%):</label>
        <input type="number" id="stepover" value="40">
      </div>
      <div>
        <label>V-Bit Hoek (°):</label>
        <input type="number" id="bitAngle" value="0" readonly style="background:#f0f0f0;">
      </div>
    </div>
  </div>

  <div class="card">
    <label>3. Afmetingen & Diepte</label>
    <div class="row">
      <div>
        <label>Werkstuk Breedte (mm):</label>
        <input type="number" id="targetWidth" value="100">
      </div>
      <div>
        <label>Threshold:</label>
        <input type="number" id="threshold" value="128">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Veilige Z (mm):</label>
        <input type="number" id="safeZ" value="5" step="0.5">
      </div>
      <div>
        <label>Freesdiepte Z (mm):</label>
        <input type="number" id="cutZ" value="-1" step="0.1">
      </div>
    </div>
  </div>

  <button onclick="generateGCode()">💾 Genereer G-Code & Download</button>

  <div class="card">
    <label>G-Code Output:</label>
    <textarea id="gcodePreview" readonly></textarea>
  </div>

  <script>
    document.title = "GRBL CAM Pro Visualizer v1.0.2";

    const imageInput = document.getElementById('imageInput');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const hmCanvas = document.getElementById('heightmapCanvas');
    const hmCtx = hmCanvas.getContext('2d');
    let img = new Image();

    const defaultLibrary = [
      { id: '1', cat: 'vlak', name: 'Vlakfrees 3.175mm (1/8")', dia: 3.175, angle: 0, feed: 600, spindle: 12000, stepover: 40 },
      { id: '2', cat: 'vlak', name: 'Vlakfrees 6.0mm', dia: 6.0, angle: 0, feed: 1000, spindle: 10000, stepover: 50 },
      { id: '3', cat: 'bol',  name: 'Ballnose Bolfrees 2.0mm', dia: 2.0, angle: 0, feed: 400, spindle: 14000, stepover: 15 },
      { id: '4', cat: 'punt', name: 'V-Bit Puntfrees 60° (6mm)', dia: 6.0, angle: 60, feed: 500, spindle: 12000, stepover: 25 },
      { id: '5', cat: 'punt', name: 'V-Bit Puntfrees 90° (6mm)', dia: 6.0, angle: 90, feed: 500, spindle: 12000, stepover: 30 }
    ];

    let bitLibrary = JSON.parse(localStorage.getItem('cnc_bit_library')) || defaultLibrary;

    function renderBitSelect() {
      const select = document.getElementById('bitSelect');
      select.innerHTML = '';
      const categories = { vlak: '--- VLAKFREEZEN ---', bol: '--- BOLFREEZEN (BALLNOSE) ---', punt: '--- PUNTFREEZEN (V-BIT) ---' };

      for (let cat in categories) {
        let group = document.createElement('optgroup');
        group.label = categories[cat];
        bitLibrary.filter(b => b.cat === cat).forEach(bit => {
          let opt = document.createElement('option');
          opt.value = bit.id;
          opt.textContent = bit.name;
          group.appendChild(opt);
        });
        select.appendChild(group);
      }
      loadSelectedBit();
    }

    function loadSelectedBit() {
      const id = document.getElementById('bitSelect').value;
      const bit = bitLibrary.find(b => b.id === id);
      if (bit) {
        document.getElementById('feedRate').value = bit.feed;
        document.getElementById('spindleSpeed').value = bit.spindle;
        document.getElementById('stepover').value = bit.stepover;
        document.getElementById('bitAngle').value = bit.angle || 0;
      }
    }

    function toggleAddBitModal() {
      const modal = document.getElementById('addBitModal');
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function saveNewBit() {
      const cat = document.getElementById('newCategory').value;
      const name = document.getElementById('newName').value || 'Custom Frees';
      const dia = parseFloat(document.getElementById('newDia').value);
      const angle = parseFloat(document.getElementById('newAngle').value) || 0;
      const feed = parseInt(document.getElementById('newFeed').value);
      const spindle = parseInt(document.getElementById('newSpindle').value);
      const stepover = parseInt(document.getElementById('newStepover').value);

      const newBit = { id: Date.now().toString(), cat, name, dia, angle, feed, spindle, stepover };
      bitLibrary.push(newBit);
      localStorage.setItem('cnc_bit_library', JSON.stringify(bitLibrary));

      renderBitSelect();
      document.getElementById('bitSelect').value = newBit.id;
      loadSelectedBit();
      toggleAddBitModal();
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          hmCanvas.width = img.width;
          hmCanvas.height = img.height;
          updatePreviews();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('threshold').addEventListener('input', () => { if (img.src) updatePreviews(); });

    function getJetColor(val) {
      let r = Math.max(0, Math.min(255, Math.round(255 * (1.5 - Math.abs(val * 4 - 3)))));
      let g = Math.max(0, Math.min(255, Math.round(255 * (1.5 - Math.abs(val * 4 - 2)))));
      let b = Math.max(0, Math.min(255, Math.round(255 * (1.5 - Math.abs(val * 4 - 1)))));
      return [r, g, b];
    }

    function updatePreviews() {
      if (!img.src) return;

      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const thresh = parseInt(document.getElementById('threshold').value);

      const hmData = hmCtx.createImageData(canvas.width, canvas.height);
      const hmPixels = hmData.data;

      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;

        const norm = avg / 255;
        const [r, g, b] = getJetColor(norm);

        hmPixels[i]     = r;
        hmPixels[i + 1] = g;
        hmPixels[i + 2] = b;
        hmPixels[i + 3] = 255;

        if (avg < thresh) {
          data[i] = 255; data[i+1] = 0; data[i+2] = 0;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      hmCtx.putImageData(hmData, 0, 0);
    }

    function generateGCode() {
      if (!img.src) { alert("Upload eerst een afbeelding!"); return; }

      const bitId = document.getElementById('bitSelect').value;
      const bit = bitLibrary.find(b => b.id === bitId);
      const stepoverPct = parseFloat(document.getElementById('stepover').value);
      const targetWidth = parseFloat(document.getElementById('targetWidth').value);
      const safeZ = parseFloat(document.getElementById('safeZ').value);
      const cutZ = parseFloat(document.getElementById('cutZ').value);
      const feedRate = parseFloat(document.getElementById('feedRate').value);
      const spindle = parseInt(document.getElementById('spindleSpeed').value);
      const thresh = parseInt(document.getElementById('threshold').value);

      let effectiveDia = bit.dia;
      if (bit.cat === 'punt' && bit.angle > 0) {
        const rad = (bit.angle / 2) * (Math.PI / 180);
        effectiveDia = Math.min(bit.dia, 2 * Math.abs(cutZ) * Math.tan(rad));
      }

      const stepmm = Math.max(0.05, effectiveDia * (1 - (stepoverPct / 100)));
      const scale = targetWidth / canvas.width;
      const stepPx = Math.max(1, Math.round(stepmm / scale));

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(img, 0, 0);
      const data = tempCtx.getImageData(0, 0, canvas.width, canvas.height).data;

      let gcode = [];
      gcode.push(`; GRBL Output - ${bit.name} (${bit.cat.toUpperCase()})`);
      gcode.push(`; Eff. Dia: ${effectiveDia.toFixed(3)}mm, Step: ${stepmm.toFixed(3)}mm (${stepPx}px)`);
      gcode.push("G21 ; mm");
      gcode.push("G90 ; Absoluut");
      gcode.push(`G0 Z${safeZ}`);
      gcode.push(`M3 S${spindle}`);

      for (let y = 0; y < canvas.height; y += stepPx) {
        let cutting = false;
        for (let x = 0; x < canvas.width; x += stepPx) {
          const idx = (y * canvas.width + x) * 4;
          const avg = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;

          if (avg < thresh) {
            const realX = (x * scale).toFixed(3);
            const realY = ((canvas.height - y) * scale).toFixed(3);

            if (!cutting) {
              gcode.push(`G0 X${realX} Y${realY}`);
              gcode.push(`G1 Z${cutZ} F150`);
              cutting = true;
            } else {
              gcode.push(`G1 X${realX} Y${realY} F${feedRate}`);
            }
          } else {
            if (cutting) {
              gcode.push(`G0 Z${safeZ}`);
              cutting = false;
            }
          }
        }
        if (cutting) {
          gcode.push(`G0 Z${safeZ}`);
          cutting = false;
        }
      }

      gcode.push(`G0 Z${safeZ}`);
      gcode.push("G0 X0 Y0\nM5\nM30");

      const resultText = gcode.join('\n');
      document.getElementById('gcodePreview').value = resultText;
      updatePreviews();

      const blob = new Blob([resultText], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `cnc_${bit.cat}_${effectiveDia.toFixed(1)}mm.gcode`;
      a.click();
    }

    renderBitSelect();
  </script>
</body>
</html>
